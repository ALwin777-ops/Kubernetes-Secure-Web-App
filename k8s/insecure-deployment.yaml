
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insecure-web
  namespace: secure-web
  labels:
    app: insecure-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insecure-web
  template:
    metadata:
      labels:
        app: insecure-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.28
          ports:
            - containerPort: 80
